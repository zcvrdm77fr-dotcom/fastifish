# Render Blueprint: FastFishingin API-palvelin.
services:
  - type: web
    name: fastfishing-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    disk:
      name: fastfishing-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://fastfishin.com,https://www.fastfishin.com
      # Frontend on GitHub Pagesissa. API-palvelin ei tarjoa repositorion juuritiedostoja.
      - key: SERVE_FRONTEND
        value: "0"
      - key: ADMIN_USERNAMES
        sync: false
      # SQLite Online Backup API:lla tehtävä paikallinen snapshot otetaan kerran vuorokaudessa.
      - key: BACKUP_INTERVAL_HOURS
        value: "24"
      - key: BACKUP_LOCAL_RETENTION
        value: "7"
      # Offsite-varmistus on valinnainen ja konfiguroidaan Render Dashboardissa S3/R2-secreteillä.
      # Katso .env.example / DEPLOY.md. Niitä ei laiteta blueprintiin sync:false-arvoiksi,
      # jotta olemassa oleva palvelu ei ala vaatia uusia secretejä tavallisessa deployssa.
