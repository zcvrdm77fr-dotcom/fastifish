# Render Blueprint: FastFishingin API-palvelin.
services:
  - type: web
    name: fastfishing-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    disk:
      name: fastfishing-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://fastfishin.com,https://www.fastfishin.com
      - key: CROSS_SITE_COOKIES
        value: "0"
      # Frontend on GitHub Pagesissa. API-palvelin ei tarjoa repositorion juuritiedostoja,
      # jolloin uusi backend/config-tiedosto ei voi vahingossa muuttua julkiseksi HTTP:n kautta.
      - key: SERVE_FRONTEND
        value: "0"
      - key: ADMIN_USERNAMES
        sync: false
      - key: BACKUP_INTERVAL_HOURS
        value: "24"
      - key: BACKUP_LOCAL_RETENTION
        value: "7"
      # Optional offsite backup (S3-compatible, e.g. Cloudflare R2). Local SQLite backups
      # run even without these secrets; health reports whether offsite is configured.
      - key: BACKUP_S3_ENDPOINT
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_REGION
        sync: false
      - key: BACKUP_S3_ACCESS_KEY_ID
        sync: false
      - key: BACKUP_S3_SECRET_ACCESS_KEY
        sync: false
      - key: BACKUP_S3_PREFIX
        value: fastfishing
