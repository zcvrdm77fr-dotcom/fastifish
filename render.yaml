# Render Blueprint: luo saalisfeedin palvelimen valmiiksi oikeilla asetuksilla.
# Käyttö: Render -> New -> Blueprint -> valitse tämä repo. Ks. DEPLOY.md.
services:
  - type: web
    name: fastfishing-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    # Pysyvä levy: ilman tätä tietokanta ja kaikki saaliskuvat katoaisivat jokaisessa
    # uudelleenkäynnistyksessä ja julkaisussa.
    disk:
      name: fastfishing-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: NODE_ENV
        value: production
      # Sivuston osoite, josta selain saa kutsua tätä APIa. Pilkulla erotettuna useampi.
      # Muuta tämä omaksi osoitteeksesi, jos sivustosi on muualla kuin fastfishin.comissa.
      - key: ALLOWED_ORIGINS
        value: https://fastfishin.com,https://www.fastfishin.com
      # 1 = sivusto ja API ovat eri osoitteissa (GitHub Pages + erillinen palvelin).
      - key: CROSS_SITE_COOKIES
        value: "1"
      # Pilkulla erotetut käyttäjänimet, joilla on oikeus poistaa KENEN TAHANSA saalisjulkaisu
      # ja -kommentti. sync: false = ei tallenneta arvoa tähän tiedostoon (julkinen repo) - aseta
      # oma käyttäjänimesi Renderin Environment-välilehdellä blueprintin luonnin jälkeen.
      - key: ADMIN_USERNAMES
        sync: false
