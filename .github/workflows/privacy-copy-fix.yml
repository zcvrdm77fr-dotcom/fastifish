name: Fix privacy copy

on:
  push:
    branches: [fix/final-hardening-feed]
    paths:
      - '.github/workflows/privacy-copy-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-hardening-feed
      - name: Update privacy wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tietosuoja.html')
          s = p.read_text()
          old = 'Istuntoeväste on HTTP-only, Secure- ja SameSite-suojattu; eri verkkotunnuksessa toimittaessa istuntotunnus voidaan tallentaa käyttäjän selaimeen API-kutsuja varten.'
          new = 'Istuntoeväste on HttpOnly-, Secure- ja SameSite=Lax-suojattu. FastFishing ei tallenna kirjautumisen istuntotunnusta localStorageen eikä palauta sitä JavaScriptille; selain lähettää evästeen API-kutsuihin credentials: include -asetuksella.'
          if old not in s:
              raise SystemExit('Old session wording not found')
          s = s.replace(old, new)
          old2 = '<li><strong>Saalisvirran sisältö</strong> – kuva, kuvateksti, kommentit, tykkäykset sekä vapaaehtoiset kalalaji-, paino-, pituus-, saantipaikka- ja viehetiedot.</li>'
          new2 = '<li><strong>Saalisvirran sisältö</strong> – kuva, kuvateksti, kommentit, tykkäykset sekä vapaaehtoiset kalalaji-, paino-, pituus-, saantipaikka- ja viehetiedot. Saantipaikka tallennetaan vain, jos käyttäjä valitsee sen erikseen julkiseksi.</li>'
          if old2 not in s:
              raise SystemExit('Old catch metadata wording not found')
          s = s.replace(old2, new2)
          p.write_text(s)
          PY
      - name: Commit privacy update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tietosuoja.html
          git commit -m 'Align privacy copy with cookie-only auth'
          git push origin HEAD:fix/final-hardening-feed
