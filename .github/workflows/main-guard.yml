name: Main branch guard

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  require-associated-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Require a merged pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          COUNT="$(gh api -H 'Accept: application/vnd.github+json' "/repos/$REPO/commits/$SHA/pulls" --jq '[.[] | select(.merged_at != null)] | length')"
          if [ "$COUNT" -lt 1 ]; then
            echo "main received a commit that is not associated with a merged pull request." >&2
            echo "Enable a GitHub ruleset for main so Quality and review requirements are enforced before merge." >&2
            exit 1
          fi
