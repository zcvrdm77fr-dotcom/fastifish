name: Fix multipart part limit

on:
  push:
    branches: [fix/final-hardening-feed]
    paths:
      - '.github/workflows/fix-upload-parts.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-hardening-feed
      - name: Fix upload part limit
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('posts.js')
          s = p.read_text()
          old = '    parts: 8,'
          new = '    parts: 10,'
          if old not in s:
              raise SystemExit('Expected part limit not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add posts.js
          git commit -m 'Allow complete feed metadata multipart form'
          git push origin HEAD:fix/final-hardening-feed
