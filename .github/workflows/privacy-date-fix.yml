name: Update privacy page date

on:
  push:
    branches: [fix/final-hardening-feed]
    paths:
      - '.github/workflows/privacy-date-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-hardening-feed
      - name: Update date
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tietosuoja.html')
          s = p.read_text()
          old = '<strong>Viimeksi päivitetty:</strong> 2.9.2026'
          new = '<strong>Viimeksi päivitetty:</strong> 3.9.2026'
          if old not in s:
              raise SystemExit('Old date not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tietosuoja.html
          git commit -m 'Update privacy page date'
          git push origin HEAD:fix/final-hardening-feed
