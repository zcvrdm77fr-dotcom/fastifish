name: Apply Google CMP cleanup

on:
  push:
    branches:
      - fix/google-cmp-cleanup
    paths:
      - scripts/apply-cmp-cleanup.mjs
      - .github/workflows/cmp-cleanup-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/google-cmp-cleanup
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply CMP cleanup
        run: node scripts/apply-cmp-cleanup.mjs
      - name: Check generated JavaScript and diff
        run: |
          node scripts/check-index-inline.mjs index.html
          git diff --check
      - name: Commit generated files
        run: |
          if git diff --quiet -- index.html tietosuoja.html; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tietosuoja.html
          git commit -m "Siirrä mainossuostumus Google-certified CMP:lle"
          git push origin HEAD:fix/google-cmp-cleanup
