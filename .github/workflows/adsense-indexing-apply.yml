name: Apply AdSense indexing sweep

on:
  push:
    branches:
      - fix/adsense-indexing-sweep
    paths:
      - scripts/apply-adsense-indexing-sweep.mjs
      - .github/workflows/adsense-indexing-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/adsense-indexing-sweep
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply sweep
        run: node scripts/apply-adsense-indexing-sweep.mjs
      - name: Validate generated files
        run: |
          node scripts/check-index-inline.mjs index.html
          git diff --check
      - name: Commit generated files
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' sitemap.xml
          git commit -m "Yhdenmukaista AdSense CMP ja canonical-linkit kaikilla sivuilla"
          git push origin HEAD:fix/adsense-indexing-sweep
