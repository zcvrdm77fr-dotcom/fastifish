name: Inspect dependency advisories

on:
  push:
    branches: [fix/final-hardening-feed]
    paths:
      - '.github/workflows/hardening-apply.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Show production audit details
        shell: bash
        run: npm audit --omit=dev || true
