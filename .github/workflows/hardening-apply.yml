name: Apply dependency audit fixes

on:
  push:
    branches: [fix/final-hardening-feed]
    paths:
      - '.github/workflows/hardening-apply.yml'

permissions:
  contents: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-hardening-feed
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply compatible security updates
        run: npm audit fix
      - name: Require clean production audit
        run: npm audit --omit=dev --audit-level=moderate
      - name: Commit lockfile security updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'No dependency lock changes required.'
            exit 0
          fi
          git commit -m 'Update audited dependencies'
          git push origin HEAD:fix/final-hardening-feed
