name: Refresh overridden dependency lock

on:
  push:
    branches: [fix/final-hardening-feed]
    paths:
      - '.github/workflows/hardening-apply.yml'

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-hardening-feed
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh lockfile with qs security override
        run: npm install
      - name: Require clean production audit
        run: npm audit --omit=dev --audit-level=moderate
      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git commit -m 'Refresh dependency lock'
          git push origin HEAD:fix/final-hardening-feed
