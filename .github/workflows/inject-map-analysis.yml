name: Verify map analysis scripts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'index.html'
      - 'scripts/inject-map-analysis-tags.mjs'
      - 'fishing-structures.js'
      - 'depth-structures.js'
      - 'gtk-substrate.js'
      - 'gtk-habitats.js'
      - 'velmu-fish.js'
      - '.github/workflows/inject-map-analysis.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/inject-map-analysis-tags.mjs'
      - 'fishing-structures.js'
      - 'depth-structures.js'
      - 'gtk-substrate.js'
      - 'gtk-habitats.js'
      - 'velmu-fish.js'
      - '.github/workflows/inject-map-analysis.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate map script tags
        run: node scripts/inject-map-analysis-tags.mjs index.html
      - name: Require committed index to be current
        shell: bash
        run: |
          if ! git diff --exit-code -- index.html; then
            echo 'index.html map-analysis tags are stale. Run:' >&2
            echo '  node scripts/inject-map-analysis-tags.mjs index.html' >&2
            exit 1
          fi
