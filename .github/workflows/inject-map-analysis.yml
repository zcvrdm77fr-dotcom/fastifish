name: Verify map analysis scripts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app.js'
      - 'scripts/inject-map-analysis-tags.mjs'
      - 'fishing-structures.js'
      - 'depth-structures.js'
      - 'gtk-substrate.js'
      - 'gtk-habitats.js'
      - 'velmu-fish.js'
      - '.github/workflows/inject-map-analysis.yml'
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'scripts/inject-map-analysis-tags.mjs'
      - 'fishing-structures.js'
      - 'depth-structures.js'
      - 'gtk-substrate.js'
      - 'gtk-habitats.js'
      - 'velmu-fish.js'
      - '.github/workflows/inject-map-analysis.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate lazy map module manifest
        run: node scripts/inject-map-analysis-tags.mjs app.js
      - name: Require committed manifest to be current
        shell: bash
        run: |
          if ! git diff --exit-code -- app.js; then
            echo 'app.js map-analysis manifest is stale. Run:' >&2
            echo '  node scripts/inject-map-analysis-tags.mjs app.js' >&2
            exit 1
          fi
